[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fde-assessment"
version = "0.1.0"
description = "MCP and LLM gateway assessment reference implementation"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
fde-mcp-server = "fde_assessment.task1_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_assessment"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

